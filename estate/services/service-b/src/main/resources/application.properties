spring.application.name=service-b
server.port=8082
management.endpoints.web.exposure.include=health
logging.cloudwatch.group=/estate/service-b
# Every ${...} below is an environment variable of the ECS task definition (estate/terraform/modules/stack/taskdef.json.tftpl).
app.events-queue=${EVENTS_QUEUE}
app.service-a-url=${SERVICE_A_URL}
app.api-key=${API_KEY}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
