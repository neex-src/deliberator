spring.application.name=service-a
server.port=8081
management.endpoints.web.exposure.include=health
logging.cloudwatch.group=/estate/service-a
# Every ${...} below is an environment variable of the ECS task definition (estate/terraform/modules/stack/taskdef.json.tftpl):
# plain `environment` entries, or `secrets` entries that point at SSM parameters and Secrets Manager secrets.
app.table=${TABLE_NAME}
app.bus=${BUS_NAME}
app.inbox-queue=${INBOX_QUEUE}
app.api-key=${API_KEY}
app.auto-publish=${APP_AUTO_PUBLISH:false}
